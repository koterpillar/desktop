- npm: '@openai/codex'
- system: claude-code
  $if:
    os: darwin
- npm: '@anthropic-ai/claude-code'
  $unless:
    os: darwin
- repo: Kilo-Org/kilocode
  binary: kilo
  exclude:
  - evidence
  - vscode
  - SHA256SUMS
  - oci
  - cdx
  - baseline
  $unless:
    hostname: DQ94*
- skill: DietrichGebert/ponytail
  agents: claude-code
- skill: AminBlg/SimpleEnglish
  agents: claude-code
- skill: koterpillar/review-aid
  agents: claude-code
