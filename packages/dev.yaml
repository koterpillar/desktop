- yum_name: vscode
  yum_url: https://packages.microsoft.com/yumrepos/vscode
  gpg_key: https://packages.microsoft.com/keys/microsoft.asc
  $if:
    os: fedora
- system:
    $switch: os
    linux: code
    darwin: visual-studio-code
  auto_updates:
    $switch: os
    darwin: true
- system: colordiff
- repo: Wilfred/difftastic
  binary: difft
- repo: sharkdp/hexyl
  binary: hexyl
- repo: tummychow/git-absorb
  binary: git-absorb
- repo: dandavison/delta
  binary: delta
- repo: codeberg.org/mergiraf/mergiraf
  binary: mergiraf
- $switch: os
  linux:
    repo: Kong/insomnia
    prefix: Insomnia.Core
    suffix: tar.gz
    binary: insomnia
  darwin:
    system: insomnia
- system: meld
  $if:
    os: linux
- system: kdiff3
  $if:
    os: darwin
- system: podman
  $if:
    os: linux
- system: podman-docker
  $if:
    os: linux
- system: docker-desktop
  $if:
    os: darwin
- repo: koalaman/shellcheck
  binary: shellcheck
  exclude: tar.gz
- system: tcpdump
