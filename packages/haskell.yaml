- url:
    $links: https://downloads.haskell.org/~cabal/cabal-install-latest/
    include:
      - $switch: architecture
        aarch64: aarch64
        x86_64: x86_64
      - $switch: os
        darwin: darwin
        linux: linux
  binary: cabal
- system: ghc
- repo: commercialhaskell/stack
  exclude: bin
  binary: stack
- repo: haskell/ghcup-hs
  exclude:
    - json
    - src
  binary: ghcup
  raw: ghcup
- repo: haskell/haskell-language-server
  binary:
    - haskell-language-server-wrapper
    - haskell-language-server-9.10.3
    - haskell-language-server-9.12.2
    - haskell-language-server-9.12.4
    - haskell-language-server-9.14.1
  include:
    $switch: os
    debian: deb13
    fedora: fedora40
- repo: fourmolu/fourmolu
  binary: fourmolu
- repo: koterpillar/hindent-build
  binary: hindent
  raw: hindent
- repo: ndmitchell/hlint
  binary: hlint
- repo: tweag/ormolu
  binary: ormolu
- repo: haskell/stylish-haskell
  binary: stylish-haskell
